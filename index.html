    <section id="radio" class="radio-player">
        <div class="radio-player__title">
            <img src="assets/images/bannerFA.jpeg" alt="" class="radio-player__banner">
        </div>
        <div class="radio-player__progress-container">
            <div class="radio-player__progress-bar">
                <div id="progressBarFill" class="radio-player__progress-bar-fill"></div>
            </div>
        </div>
        <div class="radio-player__controls">
            <div class="radio-player__control-buttons">
                <button id="playButton" class="radio-player__button radio-player__button--play">
                    <i class="fas fa-play"></i>
                </button>
                <button id="pauseButton" class="radio-player__button radio-player__button--pause">
                    <i class="fas fa-pause"></i>
                </button>
            </div>
            <div class="radio-player__volume-control">
                <i id="volumeIcon" class="fas fa-volume-up radio-player__volume-icon"></i>
                <input type="range" id="volumeSlider" class="radio-player__volume-slider" min="0" max="100" value="50">
            </div>
        </div>
        <div class="radio-player__visualizer-container">
            <div class="radio-player__visualizer" id="visualizer"></div>
        </div>
    </section>

    <!-- Formulario de Contacto (inicialmente oculto) -->
    <div id="contactFormContainer" class="contact-form-container hidden">
        <form id="contactForm" class="contact-form">
            <h2>Contacto</h2>
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" placeholder="Tu mensaje" rows="5" required></textarea>
            <button type="submit">Enviar</button>
            <button type="button" id="closeContactForm">Cerrar</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="js/radioPlayerController.js"></script>
    <script src="js/main.js"></script> <!-- Enlace al archivo JavaScript externo -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            fetch('', { // Cambia la URL para apuntar al servidor en producción
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, email, message })
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                document.getElementById('contactForm').reset();
            })
            .catch(error => {
                console.error('Error al enviar el mensaje: ', error);
                alert('Error al enviar el mensaje. Inténtalo de nuevo más tarde.');
            });
        });
    </script>
